name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core (ruff, mypy --strict, pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install pywebview websockets httpx numpy pywin32 PyAudioWPatch pytest pytest-asyncio ruff mypy
      - name: Ruff
        run: python -m ruff check app_core app.py tests
      - name: Mypy (strict)
        run: python -m mypy
      - name: Pytest
        run: python -m pytest tests -q

  frontend:
    name: Frontend (tsc strict, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
